version: 2

# 이 저장소의 npm 의존성은 전부 빌드·개발 도구다. 배포되는 것은 Jekyll 이
# 생성한 정적 파일과 Worker 번들뿐이라, 업데이트를 건건이 받을 이유가 없다.
#
# 그룹은 applies-to 별로 따로 걸어야 한다. 지정하지 않으면 version-updates
# 에만 적용되어, 정작 시끄러운 security-updates 는 여전히 PR 하나씩 열린다.
#
# major 는 제외한다. Babel 8 을 실제로 적용해 본 결과 생성된 번들이 Babel 7 과
# 바이트 단위로 같았고, @rollup/plugin-babel 이 아직 Babel 8 을 peer 로 받지
# 않아 override 로 강제해야만 설치됐다. 얻는 것 없이 부채만 남는 교체였다.
# 이 제외는 version-update 에만 걸리므로, 보안 패치는 major 라도 계속 올라온다.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      blog-tooling:
        applies-to: version-updates
        patterns:
          - "*"
      blog-tooling-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /workers/pageviews
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      worker-tooling:
        applies-to: version-updates
        patterns:
          - "*"
      worker-tooling-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      jekyll:
        applies-to: version-updates
        patterns:
          - "*"
      jekyll-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
